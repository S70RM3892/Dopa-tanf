# GitHub Pages への自動公開
# 既定ブランチに push するたびに、単語データとサイト構成を検証してから公開する。
# 初回だけ: リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする。
name: GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 単語データを検証
        run: node tools/validate-words.mjs

      - name: サイト構成を検証
        run: node tools/check-site.mjs

      - name: 公開するファイルだけを _site に集める
        run: |
          mkdir _site
          cp -r index.html app.js sw.js manifest.webmanifest icons words _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
