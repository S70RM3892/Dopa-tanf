<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--page-->
<title>超ドーパミン英単語帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="京大工学部情報学科・現役合格のための英単語の実験ノート。予測正答率を裏切るほどドーパミン（DA）が出る。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=Martian+Mono:wght@400;600;800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&family=Yomogi&display=swap">
<style>
/* Layout: 方眼のエンジニアリングペーパー1枚に、記録計(チャートレコーダ)・試行・図が描かれていく実験ノート。
   角丸・影・グラデーションのカードは使わない。罫線、枠、トンボ、鉛筆の書き込みで区切る。
   ライト=エンジニアリングペーパー(緑の方眼) / ダーク=青焼き / 就寝前=暗室の安全光(青を抜いた琥珀)。 */
:root{
  --paper:#E5ECDD; --sheet:#EFF4E8; --grid:rgba(56,102,50,.11); --grid-2:rgba(56,102,50,.24);
  --ink:#1B211C; --ink-2:#4D5848; --ink-3:#88957F; --rule:#26302A; --rule-2:rgba(38,48,42,.26);
  --da:#C1006A; --da-soft:rgba(230,0,126,.22); --blue:#2A64B8; --blue-soft:rgba(42,100,184,.17);
  --red:#BC381D; --red-soft:rgba(188,56,29,.16); --stamp:#C4122D; --shade:rgba(27,33,28,.06);
  --f-en:"STIX Two Text","Times New Roman",Georgia,serif;
  --f-ja:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-min:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-hand:"Yomogi","Hiragino Maru Gothic ProN",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E2C57; --sheet:#12345F; --grid:rgba(190,214,255,.07); --grid-2:rgba(190,214,255,.15);
    --ink:#EAF1FF; --ink-2:#A8BEE4; --ink-3:#6E89B6; --rule:#D3E2FF; --rule-2:rgba(211,226,255,.28);
    --da:#FF5DA9; --da-soft:rgba(255,93,169,.26); --blue:#8ED2FF; --blue-soft:rgba(142,210,255,.18);
    --red:#FF8B72; --red-soft:rgba(255,139,114,.2); --stamp:#FF5B5B; --shade:rgba(0,0,0,.18);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E2C57; --sheet:#12345F; --grid:rgba(190,214,255,.07); --grid-2:rgba(190,214,255,.15);
  --ink:#EAF1FF; --ink-2:#A8BEE4; --ink-3:#6E89B6; --rule:#D3E2FF; --rule-2:rgba(211,226,255,.28);
  --da:#FF5DA9; --da-soft:rgba(255,93,169,.26); --blue:#8ED2FF; --blue-soft:rgba(142,210,255,.18);
  --red:#FF8B72; --red-soft:rgba(255,139,114,.2); --stamp:#FF5B5B; --shade:rgba(0,0,0,.18);
  color-scheme:dark;
}
/* 就寝前: 暗室の安全光。青い色は1つも残さない。テーマ指定より優先（詳細度0,3,0を最後に置く）。 */
:root[data-mode="night"][data-mode]{
  --paper:#130A05; --sheet:#190E07; --grid:rgba(200,118,58,.06); --grid-2:rgba(200,118,58,.11);
  --ink:#D69860; --ink-2:#9A683E; --ink-3:#664427; --rule:#A56C3C; --rule-2:rgba(165,108,60,.3);
  --da:#DD7E3A; --da-soft:rgba(221,126,58,.2); --blue:#B5773F; --blue-soft:rgba(181,119,63,.15);
  --red:#C65435; --red-soft:rgba(198,84,53,.18); --stamp:#B44E2C; --shade:rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-ja);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid-2) 1px,transparent 1px),linear-gradient(90deg,var(--grid-2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px,40px 40px,8px 8px,8px 8px;background-position:-1px -1px;transition:background-color .6s,color .6s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px dashed var(--blue);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
a{color:var(--blue)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.hand{font-family:var(--f-hand)}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.en{font-family:var(--f-en)}

/* ---------- page ---------- */
.page{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1.5px solid var(--rule);padding-bottom:4px}
.sech h2{font-size:15px;letter-spacing:.04em}
.sech .lbl{white-space:nowrap}
.box{border:1.5px solid var(--rule)}
.slip{background:var(--sheet);border:1.5px solid var(--rule)}

/* 表題欄（エンジニアリングペーパーのヘッダ） */
.title-block{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);border:2px solid var(--rule)}
.title-block > div{padding:7px 10px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.title-block > div:nth-child(2n){border-right:0}
.title-block > div.last{border-bottom:0}
.title-block .lbl{display:block;line-height:1.3}
.title-block b{display:block;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.title-block .name b{font-family:var(--f-min);font-size:19px;letter-spacing:.06em}
.title-block .num b{font-family:var(--f-mono);font-size:14px;font-weight:600}
.rankbar{height:4px;background:var(--rule-2);margin-top:5px;position:relative}
.rankbar i{position:absolute;inset:0 auto 0 0;background:var(--da)}

/* いま思い出せる見込み */
.sr-wrap{display:grid;gap:4px}
.sr{font-family:var(--f-mono);font-weight:800;font-size:clamp(42px,13.5vw,66px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sr small{font-size:.32em;font-weight:600;letter-spacing:0;margin-left:6px;color:var(--ink-2)}
.sr-note{font-size:12.5px;color:var(--ink-2)}
.sr-note b{color:var(--ink)}
.sr-note .up{color:var(--da);font-family:var(--f-mono);font-weight:600}
.projection{width:100%;height:auto;display:block;overflow:visible}

/* 記録計 */
.strip{position:relative;height:92px;border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule)}
.strip canvas{display:block;width:100%;height:100%}
.strip .lbl{position:absolute;left:4px;top:3px;background:var(--paper);padding:0 3px}
.strip .lbl.r{left:auto;right:4px}

/* 記録開始ボタン */
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;padding:16px 16px;border:2px solid var(--rule);background:var(--sheet);text-align:left;transition:background-color .12s,color .12s}
.rec:active,.rec.press{background:var(--ink);color:var(--paper)}
.rec .dot{width:16px;height:16px;border-radius:50%;background:var(--da);animation:led 1.15s ease-in-out infinite}
@keyframes led{50%{opacity:.25}}
.rec b{font-size:19px;letter-spacing:.06em;display:block;line-height:1.25}
.rec span{display:block;font-size:12px;color:var(--ink-2);font-family:var(--f-mono)}
.rec:active span{color:inherit}
.rec .go{font-family:var(--f-mono);font-size:22px;font-weight:800}
.rec[disabled]{opacity:.45;cursor:default}
.rec[disabled] .dot{animation:none;background:var(--ink-3)}
.textbtn{font-weight:700;font-size:13.5px;border-bottom:1.5px solid currentColor;padding:2px 0;color:var(--ink)}
.textbtn[disabled]{opacity:.4;cursor:default}

/* プロトコル */
.proto{display:flex;flex-direction:column}
.proto-row{display:grid;grid-template-columns:24px minmax(0,auto) 1fr auto;align-items:end;gap:6px;padding:6px 0}
.proto-row .ck{width:18px;height:18px;border:1.5px solid var(--rule);position:relative;align-self:center}
.proto-row .ck svg{position:absolute;left:-2px;top:-7px;width:26px;height:26px;fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.proto-row .ck svg path{stroke-dasharray:40;stroke-dashoffset:0;animation:draw .5s ease-out}
@keyframes draw{from{stroke-dashoffset:40}}
.proto-row .t{font-weight:700;font-size:14px;white-space:nowrap}
.proto-row .lead{border-bottom:1.5px dotted var(--ink-3);margin-bottom:6px;min-width:12px}
.proto-row .v{font-family:var(--f-mono);font-size:13px;font-weight:600;white-space:nowrap}
.proto-row.ok .v{color:var(--da)}
.proto .why{font-size:11.5px;color:var(--ink-2);padding-left:30px}

.ld{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1.5px solid var(--rule)}
.ld > div{padding:8px 10px;border-right:1px solid var(--rule-2)}
.ld > div:last-child{border-right:0}
.ld b{display:block;font-family:var(--f-mono);font-size:14px;font-weight:600}
.claim{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:2px solid var(--da);background:var(--sheet)}
.claim b{display:block}
.claim span{font-size:12.5px;color:var(--ink-2)}
.claim.denied{border-color:var(--rule-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;min-height:44px;border:1.5px solid var(--rule);background:var(--sheet);font-weight:700;font-size:14px;transition:background-color .1s,color .1s;white-space:nowrap}
.btn:active{background:var(--ink);color:var(--paper)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.ink:active{background:var(--sheet);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}

.sets{display:flex;flex-direction:column}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--rule-2)}
.setrow.off{opacity:.45}
.setrow b{font-size:14.5px}
.setrow b small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-2);margin-left:8px;font-weight:600}
.setrow .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:right}
.setrow .bar{grid-column:1/-1;height:6px;border:1px solid var(--rule-2);display:flex}
.setrow .bar i{display:block;height:100%}
.setrow .bar .m{background:var(--ink)}
.setrow .bar .s{background:repeating-linear-gradient(90deg,var(--ink-3) 0 2px,transparent 2px 4px)}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:4px double var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));transition:background-color .6s}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink-2);font-weight:700;font-size:13.5px;position:relative}
.nav button small{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;font-weight:600}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:22%;right:22%;bottom:5px;height:3px;background:var(--da)}

/* ---------- trial ---------- */
.trial{position:fixed;inset:0;z-index:40;background-color:var(--paper);background-image:inherit;background-size:40px 40px,40px 40px,8px 8px,8px 8px;background-position:-1px -1px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.t-in{flex:1;min-height:0;width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.t-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding-block:10px 8px}
.quit{font-weight:700;font-size:13px;border:1.5px solid var(--rule);padding:6px 10px;background:var(--sheet)}
.t-meta{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);white-space:nowrap;min-width:0;line-height:1.35}
.t-meta span,.t-meta b{display:block;overflow:hidden;text-overflow:ellipsis}
.t-meta b{font-size:12.5px;font-weight:800;color:var(--da);font-variant-numeric:tabular-nums}
.vm{text-align:right;line-height:1.2}
.vm b{display:block;font-family:var(--f-mono);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.vm span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;font-weight:600;color:var(--ink-2)}
.trial[data-state="fire"] .vm span{color:var(--ink)}
.trial[data-state="burst"] .vm span,.trial[data-state="burst"] .vm b{color:var(--da)}
.trial[data-state="gamma"] .vm span,.trial[data-state="gamma"] .vm b{color:var(--da);animation:led .5s steps(2) infinite}
.trial .strip{height:84px;flex:none}
.trial[data-state="gamma"] .strip{border-color:var(--da)}
.dots{display:flex;gap:2px;padding-top:6px}
.dots i{flex:1;height:5px;border:1px solid var(--rule-2)}
.dots i.o{background:var(--ink)} .dots i.b{background:var(--da);border-color:var(--da)} .dots i.x{background:transparent;border-color:var(--red);background-image:linear-gradient(135deg,transparent 45%,var(--red) 45% 55%,transparent 55%)} .dots i.u{background:var(--ink-3)} .dots i.c{border-color:var(--ink);border-width:2px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding-block:8px;position:relative}
.stage.scroll{justify-content:flex-start;overflow-y:auto}
.stim{position:relative;min-height:156px;display:grid;place-items:center;padding:26px 14px 18px;text-align:center;
  background:
    linear-gradient(var(--rule),var(--rule)) left top/16px 1.5px no-repeat,linear-gradient(var(--rule),var(--rule)) left top/1.5px 16px no-repeat,
    linear-gradient(var(--rule),var(--rule)) right top/16px 1.5px no-repeat,linear-gradient(var(--rule),var(--rule)) right top/1.5px 16px no-repeat,
    linear-gradient(var(--rule),var(--rule)) left bottom/16px 1.5px no-repeat,linear-gradient(var(--rule),var(--rule)) left bottom/1.5px 16px no-repeat,
    linear-gradient(var(--rule),var(--rule)) right bottom/16px 1.5px no-repeat,linear-gradient(var(--rule),var(--rule)) right bottom/1.5px 16px no-repeat}
.trial[data-state="gamma"] .stim{box-shadow:inset 0 0 0 2px var(--da-soft)}
.stim .tags{position:absolute;left:10px;top:7px;display:flex;gap:10px;align-items:baseline}
.stim .tags .lbl{font-size:9px}
.stim .tags .new{color:var(--da)}
.stim .pred{position:absolute;right:12px;bottom:4px;font-family:var(--f-hand);color:var(--blue);font-size:16px;transform:rotate(-4deg);white-space:nowrap}
.fix{font-family:var(--f-mono);font-size:36px;font-weight:400;line-height:1}
.word{font-family:var(--f-en);font-weight:600;font-size:clamp(34px,11.5vw,54px);line-height:1.1;overflow-wrap:anywhere;letter-spacing:.005em}
.word.long{font-size:clamp(26px,8vw,38px)}
.word.ja{font-family:var(--f-ja);font-weight:700;font-size:clamp(20px,6vw,27px);line-height:1.45}
.pos{font-size:12px;color:var(--ink-2);margin-top:6px;display:flex;gap:10px;justify-content:center;align-items:center}
.speak{width:30px;height:30px;border:1.5px solid var(--rule-2);display:inline-grid;place-items:center;color:var(--ink)}
.speak svg{width:15px;height:15px;fill:currentColor}
.ruler{position:relative;height:9px;margin:0 2px;background:repeating-linear-gradient(90deg,var(--ink-2) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 40px);background-size:auto 5px,auto 9px;background-repeat:repeat-x;background-position:left bottom,left bottom}
.ruler i{position:absolute;top:0;bottom:0;right:0;width:0;background:var(--paper);animation:consume var(--t,8s) linear forwards}
.ruler i::before{content:"";position:absolute;left:-1px;top:-3px;bottom:-3px;width:2px;background:var(--red)}
.ruler.stop i{animation-play-state:paused}
.ruler.off{visibility:hidden}
@keyframes consume{to{width:100%}}
.readout{display:flex;gap:14px;justify-content:center;align-items:baseline;font-family:var(--f-mono);font-size:12px;min-height:20px;color:var(--ink-2);flex-wrap:wrap}
.readout b{font-weight:800}
.readout .pos-d{color:var(--da)} .readout .neg-d{color:var(--red)}
.opts{display:flex;flex-direction:column;border-bottom:1.5px solid var(--rule);flex:none}
.opt{position:relative;display:grid;grid-template-columns:2.4em minmax(0,1fr) 30px;align-items:center;gap:6px;width:100%;min-height:54px;padding:8px 6px 8px 4px;border-top:1.5px solid var(--rule);text-align:left;font-weight:700;font-size:16.5px;line-height:1.38;transition:background-color .12s,opacity .2s}
.opt:active{background:var(--shade)}
.opt .k{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-2)}
.opt .tx{position:relative;z-index:1;overflow-wrap:anywhere}
.opt.enw .tx{font-family:var(--f-en);font-size:20px;font-weight:600}
.opt::before{content:"";position:absolute;left:2.2em;right:30px;top:20%;bottom:20%;background:var(--da-soft);transform:scaleX(0) skewX(-12deg);transform-origin:left;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.opt.ok::before{transform:scaleX(1) skewX(-12deg)}
.opt.rv::before{background:var(--blue-soft);transform:scaleX(1) skewX(-12deg)}
.opt.ng .tx::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2px;background:var(--red);transform-origin:left;animation:strike .28s ease-out forwards;transform:scaleX(0) rotate(-2deg)}
@keyframes strike{to{transform:scaleX(1) rotate(-2deg)}}
.opt.dim{opacity:.38}
.opt .mk{width:28px;height:28px}
.opt .mk svg{width:28px;height:28px;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.opt .mk path{stroke-dasharray:48;stroke-dashoffset:48;animation:draw2 .35s ease-out forwards}
@keyframes draw2{to{stroke-dashoffset:0}}
.opt.ok .mk svg{stroke:var(--red)}
.opt.rv .mk svg{stroke:var(--blue)}
.opt.skel .tx{color:transparent}
.opt.skel .tx::before{content:"";position:absolute;left:0;top:50%;width:60%;height:1.5px;background:var(--rule-2)}
.t-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px 12px;min-height:52px}
.t-foot .textbtn{color:var(--ink-2)}
.t-foot .hint{font-size:11.5px;color:var(--ink-2);text-align:right}
.t-foot .hint .kb{font-family:var(--f-mono);font-size:10px;color:var(--ink-3)}
@media (pointer:coarse){.t-foot .hint .kb{display:none}}
.margin-note{position:absolute;z-index:6;pointer-events:none;font-family:var(--f-hand);font-size:20px;color:var(--red);white-space:nowrap;transform:rotate(-6deg);animation:noteIn 1.6s ease-out forwards}
.margin-note.da{color:var(--da)} .margin-note.bl{color:var(--blue)}
@keyframes noteIn{0%{opacity:0;transform:rotate(-6deg) translateY(6px)}12%{opacity:1;transform:rotate(-6deg) translateY(0)}78%{opacity:1}100%{opacity:0}}
.over{position:absolute;inset:0;pointer-events:none;z-index:5;background:var(--da-soft);animation:overflash .7s ease-out forwards}
@keyframes overflash{to{opacity:0}}

/* 正誤表 */
.errata{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:84%;overflow-y:auto;background:var(--sheet);border-top:4px double var(--rule);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:slip .22s ease-out}
@keyframes slip{from{transform:translateY(36px);opacity:0}}
.errata .in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.e-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule-2);padding-bottom:4px}
.e-head b{font-family:var(--f-min);font-size:16px;letter-spacing:.2em}
.e-head .v{font-family:var(--f-hand);font-size:17px}
.e-head .v.ng{color:var(--red)} .e-head .v.nw{color:var(--da)} .e-head .v.un{color:var(--blue)}
.e-word{display:flex;justify-content:space-between;align-items:center;gap:10px}
.e-word b{font-family:var(--f-en);font-weight:600;font-size:clamp(26px,8vw,34px);line-height:1.1;overflow-wrap:anywhere}
.e-word span{font-size:12px;color:var(--ink-2);margin-left:8px}
.e-ja{font-size:19px;font-weight:700;line-height:1.4}
.e-row{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;font-size:13.5px;align-items:baseline}
.e-row > .lbl{padding-top:2px}
.e-row .pat{font-family:var(--f-en);font-size:16px;font-style:italic}
.ex{font-family:var(--f-en);font-size:17.5px;line-height:1.55;overflow-wrap:anywhere}
.ex mark{background:linear-gradient(transparent 55%,var(--da-soft) 55%);color:inherit;font-weight:600}
.exja{font-size:14px;color:var(--ink-2);line-height:1.7}
.note{font-size:13.5px;line-height:1.65;border-left:3px solid var(--red);padding:2px 0 2px 10px}
.yours{font-size:13px;color:var(--ink-2)}
.yours s{color:var(--red)}
.autobar{height:3px;background:var(--rule-2);overflow:hidden}
.autobar i{display:block;height:100%;background:var(--da);transform-origin:left;animation:shrink var(--t,3s) linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}

/* 図（ブロック結果） */
.fig{display:flex;flex-direction:column;gap:12px;padding-block:6px 16px}
.fig-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1.5px solid var(--rule);padding-bottom:4px}
.fig-h b{font-family:var(--f-en);font-size:17px}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig .cap{font-size:12.5px;line-height:1.7}
.fig .cap b{font-family:var(--f-en)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--rule)}
.stats > div{padding:8px 10px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);min-width:0}
.stats > div:nth-child(3n){border-right:0}
.stats > div:nth-last-child(-n+3){border-bottom:0}
.stats b{display:block;font-family:var(--f-mono);font-size:clamp(15px,4.6vw,19px);font-weight:800;white-space:nowrap}
.stats b.da{color:var(--da)}
.accepted{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1.5px solid var(--rule);background:var(--sheet);position:relative;overflow:hidden}
.accepted .st{flex:none;font-family:var(--f-mono);font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--stamp);border:2.5px solid var(--stamp);padding:3px 6px;transform:rotate(-8deg);animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both}
.accepted b{font-size:13.5px;display:block}
.accepted span{font-size:11.5px;color:var(--ink-2)}
@keyframes stampIn{from{transform:rotate(-8deg) scale(2.2);opacity:0}}
.t-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding-block:8px 12px}

/* 辞令（昇任） */
.overlay{position:fixed;inset:0;z-index:85;display:grid;place-items:center;background:rgba(10,12,10,.62);padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.jirei{position:relative;background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule);padding:26px 22px;max-height:82vh;display:flex;flex-direction:column;align-items:center;gap:14px;animation:slip .3s ease-out;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.jirei .doc{writing-mode:vertical-rl;font-family:var(--f-min);font-size:17px;line-height:2.1;letter-spacing:.12em;height:min(62vh,420px);white-space:pre}
.jirei .doc .big{font-size:26px;font-weight:700;letter-spacing:.5em}
.jirei .doc .rank{font-size:23px;font-weight:700}
.hanko{position:absolute;left:22px;bottom:30px;width:74px;height:74px;border:3px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;font-family:var(--f-min);font-weight:700;font-size:15px;line-height:1.15;text-align:center;transform:rotate(-14deg);animation:hanko .5s cubic-bezier(.2,1.6,.4,1) .55s both;opacity:.9}
@keyframes hanko{from{transform:rotate(-14deg) scale(2.4);opacity:0}}
.jirei .tap{font-size:12px;color:var(--ink-2)}

/* ---------- cortex ---------- */
.cortex{position:relative;border:1.5px solid var(--rule);background:var(--sheet)}
.cortex canvas{display:block;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.weak{display:flex;flex-wrap:wrap;gap:6px}
.weak button{font-family:var(--f-en);font-size:15px;font-weight:600;border-bottom:2px solid var(--red);padding:0 2px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1.5px solid var(--rule)}
.kv > div{padding:7px 9px;border-right:1px solid var(--rule-2);min-width:0}
.kv > div:last-child{border-right:0}
.kv b{display:block;font-family:var(--f-mono);font-size:14px;font-weight:700}

/* ---------- pubs ---------- */
.pubs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.pubs li{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:4px;padding:9px 0;border-bottom:1px solid var(--rule-2);font-size:13.5px;line-height:1.55}
.pubs li .no{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding-top:1px}
.pubs li .ttl{font-weight:700}
.pubs li .jr{font-family:var(--f-en);font-style:italic;color:var(--ink-2)}
.pubs li .acc{font-family:var(--f-mono);font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--stamp);border:1.5px solid var(--stamp);padding:0 4px;margin-left:6px;vertical-align:2px}
.pubs li.pending{opacity:.5}
.pubs li.pending .ttl::before{content:"［未発表］";font-weight:400;color:var(--ink-2)}
.chart{width:100%;height:auto;display:block;overflow:visible}

/* ---------- settings ---------- */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding-bottom:10px;border-bottom:1px dotted var(--rule-2)}
.field:last-child{border-bottom:0;padding-bottom:0}
.field label{font-weight:700;font-size:14px}
.field .hint{grid-column:1/-1;font-size:12px;color:var(--ink-2)}
.field input[type="number"],.field input[type="time"],.field input[type="date"],.field input[type="text"]{font-family:var(--f-mono);font-size:14px;padding:7px 9px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);width:9.5em;border-radius:0}
.field input[type="number"]{width:6em}
.seg{grid-column:1/-1;display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));border:1.5px solid var(--rule)}
.seg button{padding:8px 4px;font-size:13px;font-weight:700;color:var(--ink-2);border-right:1px solid var(--rule-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.5px solid var(--rule);background:var(--sheet);margin:0;cursor:pointer;position:relative;border-radius:0}
.chk:checked::after{content:"";position:absolute;left:5px;top:0;width:7px;height:13px;border:solid var(--red);border-width:0 3px 3px 0;transform:rotate(40deg)}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);padding:9px 11px;font-family:var(--f-mono);font-size:12px;line-height:1.55;resize:vertical;border-radius:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.sources{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:9px;font-size:12.5px;line-height:1.6}
.sources span{color:var(--ink-2)}
.danger{color:var(--red);border-color:var(--red)}
.sync{font-family:var(--f-mono);font-size:10.5px;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.ok i{background:var(--da)} .sync.err i{background:var(--red)}

/* ---------- sheet (word) ---------- */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,10,.45)}
.sheet-body{width:100%;max-width:600px;max-height:88%;overflow-y:auto;background:var(--sheet);border-top:4px double var(--rule);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;animation:slip .22s ease-out}

/* ---------- 暗期 ---------- */
.lock{position:fixed;inset:0;z-index:90;background:#0B0603;color:#C48A55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.lock .lbl{color:#7A5233}
.lock h1{font-family:var(--f-min);font-weight:700;font-size:clamp(52px,18vw,88px);letter-spacing:.3em;line-height:1;margin-right:-.3em;color:#C48A55}
.lock .t{font-family:var(--f-mono);font-size:14px}
.lock p{max-width:30em;font-size:14px;line-height:1.85}
.lock .cite{font-size:11.5px;color:#7A5233}
.lock svg{width:min(100%,420px);height:auto}
.hold{position:relative;overflow:hidden;border:1px solid #6A4528;color:#8A5D38;padding:12px 20px;font-size:12.5px;touch-action:none}
.hold i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(196,138,85,.18)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--paper);padding:9px 14px;font-size:13px;font-weight:700;max-width:calc(100% - 32px);text-align:center;animation:slip .22s ease-out}
.toast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .ruler i,.autobar i{animation-duration:var(--t,8s)!important}
  .margin-note{animation:none!important;opacity:0}
}
@media (max-height:700px){.stim{min-height:128px;padding-top:22px}.opt{min-height:48px}.trial .strip{height:64px}}
</style>

<div class="page" id="page">
  <main>
    <section class="view" id="view-note" aria-label="ノート"></section>
    <section class="view" id="view-cortex" aria-label="皮質" hidden></section>
    <section class="view" id="view-pubs" aria-label="業績" hidden></section>
    <section class="view" id="view-config" aria-label="条件" hidden></section>
  </main>
</div>

<nav class="nav" aria-label="メニュー">
  <div class="nav-in">
    <button data-view="note" aria-current="page">ノート<small>NOTE</small></button>
    <button data-view="cortex">皮質<small>CORTEX</small></button>
    <button data-view="pubs">業績<small>PAPERS</small></button>
    <button data-view="config">条件<small>SETUP</small></button>
  </div>
</nav>

<div class="trial" id="trial" hidden>
  <div class="t-in">
    <div class="t-top">
      <button class="quit" id="quit">中断</button>
      <div class="t-meta" id="tMeta">BLOCK 01 ・ TRIAL 01/25</div>
      <div class="vm" id="vm"><b>−70.0 mV</b><span>静止</span></div>
    </div>
    <div class="strip" id="tStrip"><canvas aria-hidden="true"></canvas><span class="lbl">DA</span><span class="lbl r" id="tStripR">tonic</span></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="stage" id="stage"></div>
    <div class="opts" id="opts"></div>
    <div class="t-foot" id="tfoot"></div>
  </div>
  <div class="errata" id="errata" hidden></div>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-body" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div class="overlay" id="overlay" hidden></div>

<div class="lock" id="lock" hidden>
  <span class="lbl">DARK PHASE ・ 暗期</span>
  <h1>寝ろ</h1>
  <div class="t" id="lockTime"></div>
  <svg id="hypno" viewBox="0 0 420 120" aria-hidden="true"></svg>
  <p id="lockMsg"></p>
  <p class="cite">13〜18歳の推奨睡眠は8〜10時間（AASM, Paruthi et al., 2016）。睡眠中に学習内容が再活性化されると記憶が強まった（Rasch et al., 2007）。学習→睡眠→再学習で保持が向上（Mazza et al., 2016）。</p>
  <button class="hold" id="holdBtn"><i id="holdFill"></i><span>3秒長押しで10分だけ点灯（暗期遵守ボーナスは消える）</span></button>
</div>

<script src="app.js"></script>
<!--/page-->
