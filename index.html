<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--page-->
<title>超ドーパミン英単語帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="京大工学部情報学科・現役合格のための、分散学習×想起練習×報酬設計の英単語アプリ。睡眠を削らせない就寝ガード付き。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラムのモバイル・アプリ。上にステータス帯(Lv/XP/連続日数)、下にタブ。学習は全画面のカード。
   昼はドーパミン・ピンク×報酬ゴールド、就寝60分前からは青を抜いた琥珀色の夜モードに自動で切り替わる。 */
:root{
  --bg:#F4F2FA; --surface:#FFFFFF; --surface-2:#EAE6F5; --ink:#1A1633; --ink-2:#5E587A; --line:#DCD6EC;
  --accent:#E8175F; --accent-ink:#FFFFFF; --accent-soft:#FFDCE8;
  --gold:#E39500; --gold-soft:#FFF0C9; --gold-ink:#8F5A00;
  --good:#0B8F62; --good-soft:#D6F4E7; --bad:#D42E45; --bad-soft:#FDE1E5; --info:#0874B0; --info-soft:#DCEFFB;
  --hero:#1C1740; --hero-ink:#FFFFFF; --hero-dim:#B3ACD9;
  --d-poly:#D8155B; --d-abstract:#6A3FE0; --d-verbs:#0670AD; --d-write:#B85700; --d-tech:#0A7F57; --d-mine:#55507A;
  --shadow:0 1px 2px rgba(26,22,51,.06),0 10px 28px rgba(26,22,51,.08);
  --lock-bg:#0A0604; --lock-ink:#B8946C; --lock-dim:#6B5440;
  --f-display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#100E1D; --surface:#1A1731; --surface-2:#252142; --ink:#F1EEFF; --ink-2:#A8A2C8; --line:#302B52;
    --accent:#FF4A86; --accent-ink:#FFFFFF; --accent-soft:#4A1A33;
    --gold:#FFC23D; --gold-soft:#3D2E0A; --gold-ink:#FFD36E;
    --good:#2BD394; --good-soft:#0F3A2B; --bad:#FF6275; --bad-soft:#45161E; --info:#4DB8FF; --info-soft:#0E2E45;
    --hero:#231C4C; --hero-ink:#FFFFFF; --hero-dim:#B3ACD9;
    --d-poly:#E83A77; --d-abstract:#8461F2; --d-verbs:#1A86C7; --d-write:#C96A0A; --d-tech:#14966A; --d-mine:#6B6594;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#100E1D; --surface:#1A1731; --surface-2:#252142; --ink:#F1EEFF; --ink-2:#A8A2C8; --line:#302B52;
  --accent:#FF4A86; --accent-ink:#FFFFFF; --accent-soft:#4A1A33;
  --gold:#FFC23D; --gold-soft:#3D2E0A; --gold-ink:#FFD36E;
  --good:#2BD394; --good-soft:#0F3A2B; --bad:#FF6275; --bad-soft:#45161E; --info:#4DB8FF; --info-soft:#0E2E45;
  --hero:#231C4C; --hero-ink:#FFFFFF; --hero-dim:#B3ACD9;
  --d-poly:#E83A77; --d-abstract:#8461F2; --d-verbs:#1A86C7; --d-write:#C96A0A; --d-tech:#14966A; --d-mine:#6B6594;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
/* 就寝前モード: 青成分を抜いた低輝度の琥珀。テーマ設定より優先。 */
:root[data-mode="night"]{
  --bg:#140C07; --surface:#1D130B; --surface-2:#291B10; --ink:#D8B48C; --ink-2:#957556; --line:#3A2817;
  --accent:#C2703A; --accent-ink:#140C07; --accent-soft:#3A2214;
  --gold:#C99A4A; --gold-soft:#33240F; --gold-ink:#D9AE63;
  --good:#9AA860; --good-soft:#262A12; --bad:#C0634A; --bad-soft:#38190F; --info:#B58A5E; --info-soft:#2E2014;
  --hero:#24170C; --hero-ink:#E2BE94; --hero-dim:#957556;
  --d-poly:#A8603A; --d-abstract:#8E6A48; --d-verbs:#7E7046; --d-write:#9C6A2E; --d-tech:#78773E; --d-mine:#6E5A48;
  --shadow:none;
  color-scheme:dark;
}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;transition:background-color .6s,color .6s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding-block:12px 10px;transition:background-color .6s}
.lv{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.lv-num{font-family:var(--f-display);font-size:21px;letter-spacing:.02em}
.lv-title{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:10.5em}
.xpwrap{display:flex;flex-direction:column;gap:4px;min-width:0}
.xpbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .6s cubic-bezier(.2,.9,.3,1.15)}
.xplabel{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
.streak{display:flex;align-items:center;gap:3px;font-family:var(--f-display);font-size:19px}
.streak svg{width:20px;height:20px;fill:var(--accent)}
.streak.cold svg{fill:var(--ink-2);opacity:.6}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));transition:background-color .6s}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-2)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

.view{display:flex;flex-direction:column;gap:18px;padding-top:6px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-h h2{font-size:17px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}

/* ---------- home ---------- */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;transition:background-color .6s}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%);opacity:.55;pointer-events:none}
.hero .eyebrow{color:var(--hero-dim)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.phase-chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--hero-ink) 12%,transparent);color:var(--hero-ink);white-space:nowrap}
.ammo{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;position:relative;z-index:1}
.ammo div{display:flex;align-items:baseline;gap:6px}
.ammo b{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,15vw,64px);line-height:1}
.ammo span{font-size:13px;font-weight:700;color:var(--hero-dim)}
.start{position:relative;z-index:1;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .12s}
.start:active{transform:scale(.98)}
.start{flex-wrap:wrap}
.start b{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,6.2vw,24px);letter-spacing:.04em;white-space:nowrap}
.start span{font-size:12.5px;font-weight:700;opacity:.9;text-align:right;white-space:nowrap;margin-left:auto}
.start[disabled]{opacity:.45;box-shadow:none;cursor:default}
:root:not([data-mode="night"]) .start:not([disabled]){animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 10px 40px color-mix(in srgb,var(--accent) 70%,transparent)}}
.hero-stats{display:grid;grid-template-columns:auto 1fr 1fr;gap:14px;align-items:center;position:relative;z-index:1}
.ring{width:64px;height:64px;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:color-mix(in srgb,var(--hero-ink) 15%,transparent)}
.ring .fgc{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring b{font-family:var(--f-mono);font-size:14px}
.ring small{font-size:9.5px;color:var(--hero-dim)}
.hstat{display:flex;flex-direction:column;gap:1px;min-width:0}
.hstat b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
.hstat span{font-size:11.5px;color:var(--hero-dim)}

.alert{border-radius:16px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.alert b{white-space:nowrap}
.alert.warn{background:var(--gold-soft);color:var(--gold-ink);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.alert.calm{background:var(--surface);color:var(--ink);border-color:var(--line)}
.alert.good{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}

.decks{display:flex;flex-direction:column;gap:10px}
.deck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.deck.off{opacity:.5}
.deck h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.deck h3 i{width:10px;height:10px;border-radius:3px;background:var(--dc);flex:none}
.deck p{font-size:12px;color:var(--ink-2);grid-column:1}
.deck .cnt{grid-row:1/3;grid-column:2;text-align:right;align-self:center;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);line-height:1.35}
.deck .cnt b{font-size:17px;color:var(--ink)}
.stack{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);display:flex;overflow:hidden;margin-top:6px}
.stack i{display:block;height:100%}
.stack .m{background:var(--dc)}
.stack .l{background:color-mix(in srgb,var(--dc) 40%,transparent)}

.bounty{display:flex;flex-wrap:wrap;gap:8px}
.bounty button{border:1.5px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:6px 10px;font-family:var(--f-en);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.bounty small{font-family:var(--f-mono);font-size:10.5px}

.memo{display:flex;flex-direction:column;gap:10px}
.memo ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.memo .src{font-size:11.5px;color:var(--ink-2)}
.memo a,.sources a{color:var(--info)}

/* ---------- session ---------- */
.session{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background-color .6s}
.s-in{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.s-top{display:flex;align-items:center;gap:12px;padding-block:12px 6px}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.s-prog{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.s-prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .35s}
.s-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:2px 6px;min-height:34px}
.combo{font-family:var(--f-display);font-size:15px;color:var(--ink-2);display:flex;align-items:baseline;gap:6px;transition:color .2s}
.combo b{font-weight:400;font-size:26px;line-height:1;color:var(--ink)}
.combo.hot b{color:var(--accent)}
.combo.bump{animation:bump .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{40%{transform:scale(1.25)}}
.rxp{font-family:var(--f-mono);font-size:13px;color:var(--gold-ink);font-weight:700}
.feverbar{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;color:var(--accent-ink);background:var(--accent);padding:2px 10px;border-radius:99px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.s-stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:6px 14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.session.fever .qcard{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 34px color-mix(in srgb,var(--accent) 40%,transparent)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mode{font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.mode.new{background:var(--gold-soft);color:var(--gold-ink)}
.mode.nem{background:var(--bad-soft);color:var(--bad)}
.deckname{font-size:11.5px;font-weight:700;color:var(--dc)}
.hw{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,11vw,52px);line-height:1.12;letter-spacing:.01em;overflow-wrap:anywhere}
.hw.long{font-size:clamp(24px,7.4vw,34px)}
.hwrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pos{font-size:12.5px;color:var(--ink-2);font-weight:700}
.speak{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.speak svg{width:18px;height:18px;fill:currentColor}
.ex{font-family:var(--f-en);font-size:18px;line-height:1.6;overflow-wrap:anywhere}
.ex.big{font-size:20px}
.ex mark{background:linear-gradient(transparent 58%,var(--accent-soft) 58%);color:inherit;font-weight:600;padding:0 1px}
.ctx mark{background:none;text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:5px;text-decoration-color:var(--accent);font-weight:600}
.blank{font-family:var(--f-mono);font-size:.92em;letter-spacing:.14em;border-bottom:2.5px solid var(--accent);padding:0 3px;white-space:pre-wrap;color:var(--accent)}
.exja{font-size:14.5px;color:var(--ink-2);line-height:1.7}
.exja.lead{font-size:16px;color:var(--ink);font-weight:500}
.prompt{font-size:13px;color:var(--ink-2)}
.ans{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1.5px dashed var(--line);animation:reveal .3s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}}
.ans-ja{font-size:22px;font-weight:700;line-height:1.35}
.ans-more{font-size:13px;color:var(--ink-2)}
.note{font-size:13.5px;background:var(--surface-2);border-radius:12px;padding:10px 12px;line-height:1.6}
.note b{font-size:11px;letter-spacing:.08em;color:var(--accent);margin-right:6px}
.verdict{font-family:var(--f-display);font-size:20px}
.verdict.ok{color:var(--good)} .verdict.near{color:var(--gold-ink)} .verdict.ng{color:var(--bad)}
.yours{font-family:var(--f-mono);font-size:14px;color:var(--ink-2)}
.yours s{color:var(--bad)}
.s-actions{padding-block:10px 14px;display:grid;gap:10px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:8px 12px;font-size:13.5px;border-radius:12px}
.btn kbd,.ch kbd,.g kbd{font-family:var(--f-mono);font-size:11px;opacity:.6;font-weight:500}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.g{border:0;border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:15px;min-height:64px}
.g small{font-family:var(--f-mono);font-weight:500;font-size:11px;opacity:.85}
.g1{background:var(--bad-soft);color:var(--bad)}
.g2{background:var(--gold-soft);color:var(--gold-ink)}
.g3{background:var(--good-soft);color:var(--good)}
.g4{background:var(--info-soft);color:var(--info)}
.choices{display:grid;gap:10px}
.ch{text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:15.5px;display:flex;gap:12px;align-items:center;min-height:54px;transition:transform .1s}
.ch:active{transform:scale(.99)}
.ch.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.ch.ng{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.ch[disabled]{cursor:default}
.cloze-in{width:100%;font-family:var(--f-mono);font-size:20px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
.cloze-in:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard.pop{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{40%{transform:scale(1.025)}}
.qcard.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* results */
.result{display:flex;flex-direction:column;gap:16px;padding-block:8px}
.result h2{font-family:var(--f-display);font-weight:400;font-size:30px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}
.rbox b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15}
.rbox span{font-size:12px;color:var(--ink-2)}
.chests{display:flex;flex-wrap:wrap;gap:10px}
.chest{width:92px;height:92px;border-radius:20px;border:2px solid var(--gold);background:var(--gold-soft);display:grid;place-items:center;position:relative;color:var(--gold-ink)}
.chest svg{width:46px;height:46px}
.chest.opening{animation:rattle .6s}
@keyframes rattle{20%,60%{transform:rotate(-8deg)}40%,80%{transform:rotate(8deg)}}
.chest.opened{border-style:dashed;opacity:.55}
.loot{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;animation:reveal .35s ease-out}
.loot .rar{font-family:var(--f-display);font-size:13px;letter-spacing:.1em}
.loot .rar.ur{color:var(--accent)} .loot .rar.sr{color:var(--info)} .loot .rar.r{color:var(--gold-ink)} .loot .rar.n{color:var(--ink-2)}
.loot b{font-size:18px}
.loot p{font-size:13.5px;color:var(--ink-2)}

/* fx */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.float{position:fixed;z-index:61;pointer-events:none;font-family:var(--f-display);font-size:22px;color:var(--gold);text-shadow:0 2px 0 var(--hero);animation:floatUp .95s ease-out forwards;transform:translateX(-50%)}
@keyframes floatUp{to{opacity:0;transform:translate(-50%,-56px)}}
.banner{position:fixed;left:50%;top:34%;z-index:70;pointer-events:none;font-family:var(--f-display);font-size:clamp(36px,12vw,68px);line-height:1.05;color:var(--gold);text-align:center;white-space:nowrap;text-shadow:0 4px 0 var(--accent),0 10px 30px rgba(0,0,0,.25);animation:bannerIn 1.25s cubic-bezier(.2,1.4,.4,1) forwards}
.banner small{display:block;font-size:.3em;letter-spacing:.12em;color:var(--ink);text-shadow:none;margin-top:6px}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.flash{position:fixed;inset:0;z-index:65;pointer-events:none;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--gold) 55%,transparent),transparent 70%);animation:flash .7s ease-out forwards}
@keyframes flash{to{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13.5px;font-weight:700;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow);animation:reveal .25s ease-out}

/* ---------- zukan ---------- */
.search{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.chipbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.zdeck{display:flex;flex-direction:column;gap:10px}
.zdeck h3{font-size:15px;display:flex;align-items:center;gap:8px}
.zdeck h3 i{width:10px;height:10px;border-radius:3px;background:var(--dc)}
.zdeck h3 small{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-weight:500}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{border-radius:10px;padding:5px 10px;font-family:var(--f-en);font-size:14px;border:1.5px dashed var(--line);background:transparent;color:var(--ink-2);line-height:1.35}
.tile.s-learn{border-style:solid;border-color:var(--dc);color:var(--ink)}
.tile.s-review{border-style:solid;border-color:transparent;background:var(--surface-2);color:var(--ink)}
.tile.s-master{border-style:solid;border-color:var(--dc);background:var(--dc);color:#fff;font-weight:600}
.tile.nem{box-shadow:0 0 0 2px var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}

/* sheet */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,6,18,.5)}
.sheet-body{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:sheetUp .25s ease-out}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kv div{background:var(--surface-2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.kv b{font-family:var(--f-mono);font-size:15px}
.kv span{font-size:11px;color:var(--ink-2)}

/* ---------- log ---------- */
.tiles4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chart{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:8px;position:relative}
.chart .bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.chart .bar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:2px}
.chart .bar.hit i{background:var(--gold)}
.chart .bar.today i{outline:2px solid var(--ink);outline-offset:1px}
.chart .bar span{font-family:var(--f-mono);font-size:9.5px;line-height:14px;color:var(--ink-2);white-space:nowrap}
.chart .col{flex:1;width:100%;display:flex;align-items:flex-end}
.chart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-2);opacity:.5;pointer-events:none}
.chart .goal span{position:absolute;right:0;top:-16px;font-family:var(--f-mono);font-size:10px;color:var(--ink-2)}
.fc .bar i{background:var(--info)}

/* ---------- settings ---------- */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px}
.field label{font-weight:700;font-size:14px}
.field .hint{grid-column:1/-1;font-size:12px;color:var(--ink-2)}
.field input[type="number"],.field input[type="time"],.field input[type="date"],.field input[type="text"]{font-family:var(--f-mono);font-size:15px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);width:9.5em}
.field input[type="number"]{width:6em}
.switch{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--surface-2);border:1.5px solid var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ink-2);transition:transform .2s,background .2s}
.switch:checked{background:var(--accent);border-color:var(--accent)}
.switch:checked::after{transform:translateX(20px);background:#fff}
textarea{width:100%;min-height:110px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px 12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;resize:vertical}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.sources{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.55}
.sources li span{color:var(--ink-2)}
.danger{color:var(--bad);border-color:var(--bad)}
.sync{font-size:12.5px;display:flex;gap:8px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--bad)}

/* ---------- sleep lock ---------- */
.sleep-lock{position:fixed;inset:0;z-index:90;background:var(--lock-bg);color:var(--lock-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.sleep-lock svg{width:56px;height:56px;fill:var(--lock-dim)}
.sleep-lock h1{font-family:var(--f-display);font-weight:400;font-size:clamp(56px,20vw,96px);line-height:1;color:var(--lock-ink)}
.sleep-lock .sl-time{font-family:var(--f-mono);font-size:15px}
.sleep-lock p{max-width:30em;font-size:14px;line-height:1.8}
.sleep-lock .cite{font-size:11.5px;color:var(--lock-dim)}
.sleep-lock a{color:var(--lock-ink)}
.hold{position:relative;overflow:hidden;border:1px solid var(--lock-dim);background:transparent;color:var(--lock-dim);padding:12px 22px;border-radius:99px;font-size:13px;user-select:none;-webkit-user-select:none;touch-action:none}
.hold i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(184,148,108,.18)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .banner{animation:none!important;transform:translate(-50%,-50%)}
}
@media (min-width:480px){
  .tiles4{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>

<div class="app" id="app">

      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5-1.2 5.3-2.6 7.1C8 10.9 7 12.6 7 14.6A5 5 0 0 0 12 20a5 5 0 0 0 5-5.2c0-1.9-.8-3.3-1.7-4.6-.3 1.3-1 2.2-2 2.6.6-3.7-.2-7.6-1.3-10.8z"/></svg>

  <main>

</div>

  </div>
</nav>

  <div class="s-in">
    <div class="s-top">
      <button class="iconbtn" id="sClose" aria-label="ラウンドを終了"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

  <h1>寝ろ。</h1>
  <div class="sl-time" id="lockTime"></div>
  <p>今日覚えた単語は、寝ている間に固まる。夜更かしで削っているのは時間じゃなくて記憶そのものだ。続きは起きてから。朝の1ラウンドはXP×1.5。</p>
  <p class="cite">13〜18歳の推奨睡眠は8〜10時間（AASM, Paruthi et al., 2016）。学習と再学習の間に睡眠を挟むと、再学習が速く長期保持も良かった（Mazza et al., 2016）。</p>
